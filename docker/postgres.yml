# Use postgres/example user/password credentials

services:
    db:
        image: postgres
        restart: always
        shm_size: 256mb
        volumes:
            - pgdata:/var/lib/postgresql
        ports:
            - 5432:5432
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}

        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U nikhil -d dev_db']
            interval: 5s
            timeout: 5s
            retries: 10

    adminer:
        image: adminer
        restart: always
        ports:
            - 8080:8080
        depends_on:
            db:
                condition: service_healthy
volumes:
    pgdata:
